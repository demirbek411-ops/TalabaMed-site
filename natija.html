<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Mening natijam</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #131519);
    --fg: var(--tg-theme-text-color, #eef1f5);
    --hint: var(--tg-theme-hint-color, #8b95a3);
    --card: var(--tg-theme-secondary-bg-color, #1b1f26);
    --accent: var(--tg-theme-button-color, #3b82f6);
    --accent-fg: var(--tg-theme-button-text-color, #fff);
    --line: rgba(127,127,127,.22);
    --red:#d64545; --amber:#f0a500; --green:#1f9d55;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body{ padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px)); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .head{ display:flex; justify-content:space-between; align-items:center; font-weight:600; margin-bottom:6px; }
  .head small{ color:var(--hint); font-weight:400; font-size:13px; }
  .grp{ color:var(--hint); font-size:13px; margin:12px 0 2px; }
  .row{ display:flex; align-items:center; gap:10px; margin:9px 0; font-size:15px; }
  .row .n{ flex:0 0 42%; min-width:0; }
  .bar{ flex:1; height:9px; border-radius:5px; background:rgba(127,127,127,.18); overflow:hidden; }
  .bar i{ display:block; height:9px; border-radius:5px; }
  .row .v{ flex:0 0 40px; text-align:right; color:var(--hint); font-size:14px; }
  .row.dim .n, .row.dim .v{ color:var(--hint); }
  .warn{ background:rgba(214,69,69,.16); color:#ff8f8f; border-radius:10px; padding:10px 12px; font-size:14px; margin:12px 0; }
  .ok{ background:rgba(31,157,85,.16); color:#6fd49a; border-radius:10px; padding:10px 12px; font-size:14px; margin:12px 0; }
  .btns{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .btn{ border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:10px; padding:11px 8px; font:inherit; font-size:15px; text-align:center; }
  .btn.p{ background:var(--accent); color:var(--accent-fg); border-color:transparent; font-weight:500; }
  .btn:disabled{ opacity:.5; }
  .note{ color:var(--hint); font-size:13px; margin-top:10px; }
  .empty{ text-align:center; color:var(--hint); padding:28px 8px; }
</style>
</head>
<body>
<div id="app"><div class="card"><div class="empty">Yuklanmoqda...</div></div></div>
<script>
const API = 'https://talabmed-bot.onrender.com/api/mystats';
const MIN_N = 5;
const tg = window.Telegram && window.Telegram.WebApp;
if (tg){ tg.ready(); tg.expand(); }
const app = document.getElementById('app');
let showAll = false, data = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color = p => p < 60 ? 'var(--red)' : (p < 80 ? 'var(--amber)' : 'var(--green)');

function row(x){
  const dim = x.answered < MIN_N;
  const p = x.answered ? Math.round(100 * x.correct / x.answered) : 0;
  const bar = dim ? '<span class="bar"></span>' : '<span class="bar"><i style="width:' + p + '%;background:' + color(p) + '"></i></span>';
  const val = dim ? (x.answered ? x.answered + ' ta' : '\u2014') : p + '%';
  return '<div class="row' + (dim ? ' dim' : '') + '"><span class="n">' + esc(x.name) + '</span>' + bar + '<span class="v">' + val + '</span></div>';
}
function render(){
  const ev = data.filter(x => x.answered >= MIN_N).map(x => Object.assign({p: x.correct / x.answered}, x)).sort((a, b) => a.p - b.p);
  if (!data.length){
    app.innerHTML = '<div class="card"><div class="empty">Hali natija yo\'q.<br>Saytda test yeching: har mavzudan kamida ' + MIN_N + ' ta javob bergach, tahlil shu yerda chiqadi.</div></div>';
    return;
  }
  const sem = data.filter(x => x.topic[0] === 'T').sort((a, b) => +a.topic.slice(1) - +b.topic.slice(1));
  const fin = data.filter(x => x.topic[0] === 'F').sort((a, b) => a.topic.localeCompare(b.topic));
  let list = '';
  if (showAll){
    if (sem.length) list += '<div class="grp">Gistologiya, seminar mavzulari</div>' + sem.map(row).join('');
    if (fin.length) list += '<div class="grp">Yakuniy testlar</div>' + fin.map(row).join('');
  } else {
    list = (ev.length ? ev.slice(0, 5) : data.slice(0, 5)).map(row).join('');
  }
  let weak = '', canWeak = false, wkey = '';
  if (ev.length){
    const w = ev[0], wp = Math.round(100 * w.p);
    if (wp < 80){
      canWeak = w.topic[0] === 'T'; wkey = w.topic.slice(1);
      weak = '<div class="warn">Eng zaif: ' + esc(w.name) + ' (' + wp + '%). ' + (canWeak ? 'Shu mavzudan 30 ta test tavsiya etiladi.' : 'Shu fanni takrorlash tavsiya etiladi.') + '</div>';
    } else {
      weak = '<div class="ok">Hamma mavzularda natijangiz yaxshi (80% dan yuqori). Davom eting!</div>';
    }
  } else {
    weak = '<div class="note">Tahlil uchun har mavzudan kamida ' + MIN_N + ' ta javob kerak.</div>';
  }
  app.innerHTML = '<div class="card"><div class="head"><span>Mening natijam</span><small>' + (showAll ? 'Barcha mavzular' : 'Eng zaif 5 tasi') + '</small></div>' + list + weak +
    '<div class="btns"><button class="btn p" id="wk"' + (canWeak ? '' : ' disabled') + '>Zaif mavzudan 30 ta test</button><button class="btn" id="all">' + (showAll ? 'Qisqa ko\'rinish' : 'Barcha mavzular') + '</button></div>' +
    '<div class="note">Natijalar faqat saytdagi javoblaringiz asosida, har savol kuniga bir marta hisoblanadi.</div></div>';
  document.getElementById('all').onclick = () => { showAll = !showAll; render(); };
  if (canWeak) document.getElementById('wk').onclick = () => {
    location.href = location.href.replace(/natija\.html.*$/, '') + '?weak=' + wkey;
  };
}
async function load(){
  if (!tg || !tg.initData){ app.innerHTML = '<div class="card"><div class="empty">Natijani ko\'rish uchun botdagi tugma orqali oching.</div></div>'; return; }
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initData: tg.initData }) });
    const j = await r.json();
    if (!j.ok) throw new Error('server');
    data = j.items || [];
    render();
  } catch (e){
    app.innerHTML = '<div class="card"><div class="empty">Natijani yuklab bo\'lmadi. Birozdan keyin qayta urinib ko\'ring.<br><br><button class="btn" id="rt">Qayta urinish</button></div></div>';
    document.getElementById('rt').onclick = load;
  }
}
load();
</script>
</body>
</html>
